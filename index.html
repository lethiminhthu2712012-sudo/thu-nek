<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ăn Vụng Trong Lớp Học</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        #game-container {
            width: 1000px; height: 562px; position: relative; background: #e0d0b0;
            border: 4px solid #333; box-shadow: 0 0 25px rgba(0,0,0,0.9); overflow: hidden;
        }

        .screen { display: none !important; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex !important; flex-direction: column; justify-content: center; align-items: center; }

        #intro-screen { background: #000; text-align: center; position: relative; }
        #intro-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none;
        }
        .intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 50px;
        }
        
        .btn-main {
            padding: 18px 45px; font-size: 24px; font-weight: bold; background: #2e7d32; 
            color: white; border: 4px solid #fff; border-radius: 12px; cursor: pointer; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.8); z-index: 1000; transition: 0.2s;
        }
        .btn-main:hover { background: #388e3c; transform: scale(1.05); }

        #name-screen, #menu-screen { background: #f4ecd8; padding: 20px; text-align: center; }
        .food-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; max-height: 380px; overflow-y: auto; padding: 10px; }
        .food-card { background: white; border: 2px solid #ccc; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; }
        .food-card:hover { border-color: #ff9800; background: #fffdf9; }
        .food-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }

        #gameplay-screen {
            background: linear-gradient(to bottom, #dbe9f4 0%, #dbe9f4 55%, #c2b280 55%, #c2b280 100%);
            position: relative; justify-content: flex-start !important;
        }
        #teacher-box { position: absolute; top: 15px; right: 25px; width: 110px; height: 140px; text-align: center; }
        #teacher-box img { width: 100%; height: 100%; object-fit: contain; }
        #warning-sign { display: none; color: red; font-size: 40px; font-weight: bold; position: absolute; top: -30px; left: 40px; }

        #student-desk {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 420px; height: 110px; background: #8b5a2b; border-radius: 8px; border: 3px solid #5c3a1e;
            display: flex; align-items: center; justify-content: space-around; padding: 0 15px;
        }
        #food-container { width: 80px; height: 80px; position: relative; overflow: hidden; background: #fff; border-radius: 50%; border: 3px solid #ddd; }
        #food-image { width: 100%; height: 100%; object-fit: cover; transition: clip-path 0.3s ease; }

        #question-box {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            width: 660px; background: rgba(255, 255, 255, 0.98);
            padding: 22px; border-radius: 12px; border: 3px solid #333; text-align: center;
        }
        #question-text { font-size: 21px; font-weight: bold; color: #111; margin-bottom: 18px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn {
            padding: 12px 15px; text-align: center; background: #e3f2fd; border: 2px solid #90caf9; 
            border-radius: 8px; cursor: pointer; font-size: 17px; font-weight: bold; color: #0d47a1;
        }
        .option-btn:hover { background: #bbdefb; }

        #hud-top { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px 18px; border-radius: 8px; font-size: 18px; z-index: 10; }
        #read-book-btn { position: absolute; bottom: 20px; right: 20px; padding: 12px 20px; background: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 10; }

        .overlay-screen { background: rgba(0,0,0,0.92); color: white; text-align: center; padding-top: 130px; }
    </style>
</head>
<body>

<audio id="sound-menu" loop onerror="this.style.display='none'"><source src="assets/audios/sound_1_menu.wav" type="audio/wav"></audio>
<audio id="sound-click" onerror="this.style.display='none'"><source src="assets/audios/sound_2_click.wav" type="audio/wav"></audio>
<audio id="sound-interfere" onerror="this.style.display='none'"><source src="assets/audios/sound_3_interfere.wav" type="audio/wav"></audio>
<audio id="sound-cry" onerror="this.style.display='none'"><source src="assets/audios/sound_4_cry.wav" type="audio/wav"></audio>
<audio id="sound-bienik" onerror="this.style.display='none'"><source src="assets/audios/sound_5_bienik.wav" type="audio/wav"></audio>
<audio id="sound-correct" onerror="this.style.display='none'"><source src="assets/audios/sound_correct.wav" type="audio/wav"></audio>
<audio id="sound-win" onerror="this.style.display='none'"><source src="assets/audios/sound_win.wav" type="audio/wav"></audio>
<audio id="sound-wrong" onerror="this.style.display='none'"><source src="assets/audios/sound_wrong.wav" type="audio/wav"></audio>

<div id="game-container">
    <div id="intro-screen" class="screen active">
        <video id="intro-video" autoplay muted loop playsinline onerror="this.style.display='none'">
            <source src="assets/videos/intro_video.mp4" type="video/mp4">
        </video>
        <div class="intro-overlay">
            <button class="btn-main" onclick="startGameFlow()">▶ BẮT ĐẦU NGAY</button>
        </div>
    </div>

    <div id="name-screen" class="screen">
        <h2>Nhập tên học sinh ăn vụng:</h2>
        <input type="text" id="username" style="padding: 12px; font-size: 18px; margin: 15px; width: 280px; text-align: center;" placeholder="Ví dụ: An Nhi...">
        <br>
        <button class="btn-main" onclick="goToMenu()">TIẾP TỤC</button>
    </div>

    <div id="menu-screen" class="screen">
        <h2>LỰA CHỌN MÓN ĂN VỤNG TRÊN BÀN</h2>
        <div class="food-grid" id="food-list"></div>
    </div>

    <div id="gameplay-screen" class="screen">
        <div id="hud-top">
            <div>⏰ Thời gian: <span id="timer">120</span>s</div>
            <div>🍗 Tiến độ: <span id="progress">0</span>/<span id="total-q">20</span> câu</div>
        </div>

        <div id="teacher-box">
            <div id="warning-sign">!</div>
            <img src="assets/images/teacher_white.png" alt="Thầy Vĩnh" onerror="this.style.display='none'">
        </div>

        <div id="question-box">
            <p id="question-text"></p>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="student-desk">
            <p style="color: #fff; font-size: 14px; font-weight: bold;">Món đang ăn:</p>
            <div id="food-container">
                <img id="food-image" src="" alt="Món ăn" onerror="this.style.background='#ccc'">
            </div>
        </div>

        <button id="read-book-btn" onclick="pretendReadBook()">📖 Giả vờ đọc sách</button>
    </div>

    <div id="endgame-choice-screen" class="screen overlay-screen">
        <h2 id="end-title" style="font-size: 32px; margin-bottom: 15px;">KẾT THÚC TRÒ CHƠI</h2>
        <p id="end-message" style="font-size: 20px; color: #ddd;"></p>
        <div style="margin-top: 20px;">
            <button class="btn-main" onclick="restartGame()">Có</button>
            <button class="btn-main" style="background: #f44336; margin-left: 15px;" onclick="chooseHok()">Hok</button>
        </div>
    </div>

    <div id="bien-ik-screen" class="screen overlay-screen">
        <div style="font-size: 90px; color: red; font-weight: bold;">BIẾN IK</div>
    </div>
</div>

<script>
    const foods = [
        { name: "Bánh mì", level: "Dễ", questions: 20, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=150" },
        { name: "Sandwich", level: "Dễ", questions: 20, img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=150" },
        { name: "Kẹo mút", level: "Dễ", questions: 20, img: "https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=150" },
        { name: "Xôi gấc", level: "Dễ", questions: 20, img: "https://images.unsplash.com/photo-1541529086526-db283c563270?w=150" }
    ];

    const questionsBank = [
        { q: "Toán 6: Kết quả của phép tính 2^3 . 2^2 bằng bao nhiêu?", options: ["32", "16", "64", "8"], a: 0 },
        { q: "Toán 6: Số nguyên tố nhỏ nhất là số nào?", options: ["0", "1", "2", "3"], a: 2 },
        { q: "Toán 7: Tổng số đo ba góc trong một tam giác bằng bao nhiêu độ?", options: ["90°", "180°", "270°", "360°"], a: 1 }
    ];

    let selectedFood = null, timer = 120, timerInterval = null, correctAnswersCount = 0;

    function playSound(id) {
        try {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        } catch(err) {}
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) target.classList.add('active');
    }

    function startGameFlow() {
        playSound('sound-click');
        playSound('sound-menu');
        showScreen('name-screen');
    }

    function goToMenu() {
        playSound('sound-click');
        const name = document.getElementById('username').value.trim();
        if (!name) { alert("Vui lòng nhập tên của bạn!"); return; }
        
        showScreen('menu-screen');
        const list = document.getElementById('food-list');
        list.innerHTML = '';
        
        foods.forEach(food => {
            const card = document.createElement('div');
            card.className = 'food-card';
            card.innerHTML = `<img src="${food.img}"><h4>${food.name}</h4><p>${food.level}</p>`;
            card.onclick = () => { playSound('sound-click'); startGame(food); };
            list.appendChild(card);
        });
    }

    function startGame(food) {
        selectedFood = food; timer = 120; correctAnswersCount = 0;
        document.getElementById('total-q').innerText = food.questions;
        document.getElementById('progress').innerText = 0;
        document.getElementById('food-image').src = food.img;
        document.getElementById('food-image').style.clipPath = 'circle(100% at 50% 50%)';
        
        showScreen('gameplay-screen');
        loadQuestion();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if (timer <= 0) triggerLose();
        }, 1000);
    }

    function loadQuestion() {
        const q = questionsBank[Math.floor(Math.random() * questionsBank.length)];
        document.getElementById('question-text').innerText = q.q;
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => { playSound('sound-click'); checkAnswer(idx === q.a); };
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            playSound('sound-correct');
            correctAnswersCount++;
            document.getElementById('progress').innerText = correctAnswersCount;
            let rem = 100 - (correctAnswersCount / selectedFood.questions * 100);
            document.getElementById('food-image').style.clipPath = `circle(${rem}% at 50% 50%)`;
            if (correctAnswersCount >= selectedFood.questions) triggerWin();
        } else {
            playSound('sound-wrong');
            playSound('sound-interfere');
            timer = Math.max(0, timer - 5);
            document.getElementById('timer').innerText = timer;
            document.getElementById('warning-sign').style.display = 'block';
            setTimeout(() => { document.getElementById('warning-sign').style.display = 'none'; }, 1000);
        }
        loadQuestion();
    }

    function pretendReadBook() { playSound('sound-click'); alert("Giả vờ đọc sách thành công!"); }
    function triggerWin() { clearInterval(timerInterval); playSound('sound-win'); showScreen('endgame-choice-screen'); }
    function triggerLose() { clearInterval(timerInterval); playSound('sound-cry'); showScreen('endgame-choice-screen'); }
    function restartGame() { playSound('sound-click'); showScreen('intro-screen'); }
    function chooseHok() { playSound('sound-bienik'); showScreen('bien-ik-screen'); }
</script>
</body>
</html>
